function load(key,fallback){
  try {
    const raw=localStorage.getItem('phase.'+key);if(!raw)return fallback;
    const value=JSON.parse(raw);
    if(value===null||typeof value!==typeof fallback||Array.isArray(value)!==Array.isArray(fallback)){
      console.warn('PHASE: invalid saved '+key+'; using defaults.');return fallback;
    }
    return value;
  }
  catch(e){storageWarning=true;return memory[key]===undefined?fallback:memory[key];}
}
function save(key,value){
  memory[key]=value;
  try{localStorage.setItem('phase.'+key,JSON.stringify(value));}
  catch(e){storageWarning=true;}
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){
  let state=seed>>>0;
  const random=()=>{
    state=(state+0x6D2B79F5)>>>0;
    let t=Math.imul(state^state>>>15,state|1);
    t^=t+Math.imul(t^t>>>7,t|61);
    return ((t^t>>>14)>>>0)/4294967296;
  };
  Object.defineProperty(random,'state',{get:()=>state});
  return random;
}

function polygon(n,r,inner=1,rotation=-Math.PI/2){
  ctx.beginPath();
  for(let i=0;i<n;i++){const a=rotation+i*Math.PI*2/n, rr=r*(i%2?inner:1);const x=Math.cos(a)*rr,y=Math.sin(a)*rr;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}
  ctx.closePath();
}
function drawIcon(mode,x,y,size,angle,alpha=1,gravity=1){
  const s=skins[mode], k=s.shape;

  ctx.fillStyle=s.primary;ctx.strokeStyle=s.glow;ctx.lineWidth=1.7;
  ctx.shadowColor=s.glow;ctx.shadowBlur=settings.glow?14:0;
  if(mode===0||mode===5){
    if(k===0)ctx.beginPath(),ctx.rect(-15,-15,30,30);
    if(k===1)polygon(4,20,1,0);
    if(k===2)polygon(8,17,1,Math.PI/8);
    if(k===3)polygon(6,18);
    if(k===4)polygon(16,19,.78,Math.PI/8);
    if(k===5){ctx.beginPath();ctx.moveTo(-7,-17);ctx.lineTo(7,-17);ctx.lineTo(7,-7);ctx.lineTo(17,-7);ctx.lineTo(17,7);ctx.lineTo(7,7);ctx.lineTo(7,17);ctx.lineTo(-7,17);ctx.lineTo(-7,7);ctx.lineTo(-17,7);ctx.lineTo(-17,-7);ctx.lineTo(-7,-7);ctx.closePath();}
    if(k===6)polygon(4,21,.78);
    if(k===7){ctx.beginPath();ctx.moveTo(-15,-9);ctx.lineTo(-9,-16);ctx.lineTo(15,-16);ctx.lineTo(15,9);ctx.lineTo(9,16);ctx.lineTo(-15,16);ctx.closePath();}
    ctx.fill();ctx.stroke();
    if(mode===5){ctx.shadowBlur=0;ctx.fillStyle=s.secondary;ctx.fillRect(-14,8,11,8);ctx.fillRect(3,8,11,8);ctx.fillStyle=s.primary;ctx.fillRect(-18,15,14,5);ctx.fillRect(4,15,14,5);}
  }else if(mode===1){
    ctx.beginPath();ctx.moveTo(21,0);ctx.lineTo(-15,-9-k*.8);ctx.lineTo(-6,0);ctx.lineTo(-15,9+k*.8);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle=s.secondary;ctx.beginPath();ctx.ellipse(0,0,8+k*.45,5+k*.2,0,0,7);ctx.fill();
    if(k%2){ctx.strokeStyle=s.primary;ctx.beginPath();ctx.moveTo(-16,-16);ctx.lineTo(-12,16);ctx.stroke();}
  }else if(mode===2){
    ctx.beginPath();ctx.moveTo(20,0);ctx.lineTo(-14,-16);ctx.lineTo(-5,0);ctx.lineTo(-14,16);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle=s.secondary;polygon(3,5+k*.7,1,0);ctx.fill();
    if(k>3){ctx.beginPath();ctx.moveTo(-15,-20);ctx.lineTo(6,0);ctx.lineTo(-15,20);ctx.stroke();}
  }else if(mode===3){
    polygon(12+k*2,18,k%2?.72:.9,time*.3);ctx.fill();ctx.stroke();
    ctx.fillStyle=s.secondary;polygon(6+k,11,1,-time*.3);ctx.fill();
  }else if(mode===4){
    ctx.beginPath();ctx.ellipse(0,5,20,5+k*.4,0,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle=s.secondary;ctx.beginPath();ctx.ellipse(0,-2,10+k*.6,10,0,Math.PI,0);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle=s.primary;for(let i=0;i<3;i++)ctx.fillRect(-11+i*9,8,4,3);
  }else{
    ctx.lineWidth=3;for(let i=0;i<3;i++){const a=(i-1)*9;ctx.beginPath();ctx.moveTo(-8,a*.6);ctx.lineTo(-19-k*.6,a*1.6);ctx.lineTo(-21+k*.5,a*1.6+9);ctx.moveTo(8,a*.6);ctx.lineTo(19+k*.6,a*1.6);ctx.lineTo(21-k*.5,a*1.6+9);ctx.stroke();}
    polygon(6+k%3,14,1,Math.PI/6);ctx.fill();ctx.stroke();
  }
  ctx.shadowBlur=0;ctx.strokeStyle=s.secondary;ctx.fillStyle=s.secondary;ctx.lineWidth=2;
  if(s.overlay==='eyes'){ctx.fillRect(-7,-5,4,5);ctx.fillRect(3,-5,4,5);ctx.fillRect(-3,4,7,2);}
  if(s.overlay==='visor'){ctx.fillRect(-10,-5,20,7);ctx.fillStyle='#ffffff';ctx.fillRect(1,-4,6,2);}
  if(s.overlay==='cross'){ctx.fillRect(-2,-9,4,18);ctx.fillRect(-9,-2,18,4);}
  if(s.overlay==='stripes'){ctx.beginPath();ctx.moveTo(-10,7);ctx.lineTo(5,-8);ctx.moveTo(-3,10);ctx.lineTo(10,-3);ctx.stroke();}
  ctx.restore();
}

    if(!forced)throw new Error('Unknown forced test pattern: '+w.level.patternIds[index]);
    w.counts[forced.id]=(w.counts[forced.id]||0)+1;
    return forced;
  }
  if(mode===2&&w.level.kind==='campaign'){
    const next=w.level.modes[index+1],name=next===0?'cube-exit':next===1?'ship-exit':'';
    const exit=library.find(p=>p.name===name);
    if(exit&&(w.counts[exit.id]||0)<2&&!w.recent.includes(exit.id)){
      w.recent.push(exit.id);if(w.recent.length>4)w.recent.shift();
      w.counts[exit.id]=(w.counts[exit.id]||0)+1;return exit;
    }

  let total=0;
  for(const p of library){
    if(w.recent.includes(p.id)||(!w.endless&&(w.counts[p.id]||0)>=2))continue;
    if(w.level.flowParty&&mode===2&&(p.mini||p.tier>3||p.name.startsWith('dual-')))continue;
    if(w.level.kind!=='campaign'&&(p.name==='cube-exit'||p.name==='ship-exit'))continue;
    if(p.name==='cube-exit'&&w.level.modes[index+1]!==0)continue;
    if(p.name==='ship-exit'&&w.level.modes[index+1]!==1)continue;
    if(mode!==2&&p.orb!==(index%3===1))continue;

    const planned=(ARRANGEMENT[index%ARRANGEMENT.length]+w.level.signatureIndex*3)%library.length;

    let weight=w.endless?p.weight*(w.counts[p.id]? .1:3):

    case 10:return Math.cos(t*Math.PI*3)*.55;

  compactBehind(w.chunks,x,c=>c.base+CONFIG.chunkWidth);

    const first=w.entities.findIndex(e=>e.bx>=chunk.base);
    chunk.entityStart=first<0?w.entities.length:first;
  }
}
function makePlayer(mode){
  const p={x:0,y:355,px:0,py:355,vy:0,gravity:1,mode,speed:1,size:1,
    grounded:![1,2,4].includes(mode),angle:0,pa:0,buffer:0,orbBuffer:0,dual:false,dualOffset:0,
    serial:0,orbSerial:-1,lastOrb:-1,orbCount:0,hold:0,dead:false,
    teleport:0,snapFrom:355,padLock:0,cooldown:0,dash:0,support:null,
    shipEntry:mode===1?CONFIG.shipEntryDuration:0};
  if(p.grounded)p.y=CONFIG.floor-playerHalf(p);
  p.py=p.y;return p;
}
function levelMetrics(w){
  const counts=new Map(),types=new Set();
  let longest=0,streak=0,previous='',tightest=Infinity,obstacles=0,orbs=0;
  for(const c of w.chunks){
    types.add(c.pattern.id);counts.set(c.pattern.id,(counts.get(c.pattern.id)||0)+1);
    streak=c.pattern.family===previous?streak+1:1;
    longest=Math.max(longest,streak);previous=c.pattern.family;
  }
  for(const e of w.entities){
    if(e.type==='orb')orbs++;
    if(['spike','block','saw','laser'].includes(e.type))obstacles++;
  }
  for(const c of w.channels)tightest=Math.min(tightest,(c.half-c.pulse)*2);

    orbs,orbsPerMinute:+(orbs/seconds*60).toFixed(1),

    distinct:types.size,longestSimilarRun:longest,repeats,
    varietyScore:clamp(Math.round(types.size*5+Math.max(0,5-longest)*4-repeats*2),0,100)};
}
function validateLevel(level,options={}){
  const w=newWorld(level,!!options.endless,options.seed||'VALIDATE',options.mode===undefined?-1:options.mode);
  if(options.endless){w.keepHistory=true;extendWorld(w,options.distance||CONFIG.chunkWidth*18);}
  const p=makePlayer(w.chunks[0].mode),errors=[],fired=new Set(),pending=new Map();
  w.clock=0;
  let previous='',distinct=new Set(),waveTypes=new Set(),lastDown=false,orbCount=0;
  const counts=new Map();
  for(const c of w.chunks){
    if(c.pattern.id===previous)errors.push('Consecutive repeat: '+previous);
    previous=c.pattern.id;distinct.add(previous);
    if(c.mode===2)waveTypes.add(previous);
    counts.set(previous,(counts.get(previous)||0)+1);
    if(!options.endless&&counts.get(previous)>2)errors.push('More than two repeats: '+previous);
    for(const bits of c.tape){
      if((bits&2)&&(!(bits&1)||lastDown))errors.push('Invalid press edge at '+p.x.toFixed(1));
      lastDown=!!(bits&1);
      physics(p,w,CONFIG.step,!!(bits&1),!!(bits&2),false);
      if(p.orbCount!==orbCount){
        orbCount=p.orbCount;fired.add(p.lastOrb);pending.set(p.lastOrb,w.clock);
      }
      for(const [id,clock] of pending){
        const settled=p.grounded||((p.mode===1||p.mode===4)&&Math.abs(p.vy)<320&&
          p.y>CONFIG.ceiling+playerHalf(p)+30&&p.y<CONFIG.floor-playerHalf(p)-30);
        if(settled&&w.clock-clock>.25)pending.delete(id);
      }
      if(p.dead){errors.push('Fatal witness at '+p.x.toFixed(1));break;}
    }
    if(p.dead)break;
  }
  for(const e of w.entities)if(e.type==='orb'){
    const c=w.chunks.find(c=>e.bx>=c.base&&e.bx<c.base+CONFIG.chunkWidth);
    if(c&&c.mode!==2&&!fired.has(e.oid))errors.push('Impossible orb '+e.oid);
  }
  for(const id of pending.keys())errors.push('No verified landing/recovery after orb '+id);
  if(!options.endless){
    const target=level.kind==='challenge'?level.modes.length:
      level.kind==='campaign'?12:Math.min(12,PATTERNS[MODES[level.modes[0]]].length);
    if(distinct.size<target)errors.push('Low variety: '+distinct.size);
    if(level.modes.filter(m=>m===2).length>=8&&waveTypes.size<8)errors.push('Fewer than eight wave types');
  }
  const metrics=levelMetrics(w);
  const waveOnly=level.modes.every(m=>m===2);
  const extreme=level.kind==='challenge',hard=level.difficulty==='Hard'||extreme;
  const min=hard?15:8;
  const max=w.level.flowParty?55:extreme?55:hard?(waveOnly?30:45):(waveOnly?15:30);
  if(metrics.orbsPerMinute<min||metrics.orbsPerMinute>max)errors.push('Orb density outside target: '+metrics.orbsPerMinute);
  if(extreme&&(p.x<w.length||w.clock>CONFIG.challengeMaxDuration))
    errors.push('Challenge must finish within '+CONFIG.challengeMaxDuration+' seconds');
  const result={ok:errors.length===0,errors,metrics,waveTypes:waveTypes.size};
  if(settings.debugLevels||CONFIG.debugLevels){console.table([metrics]);if(errors.length)console.error('[PHASE validator]',errors);}
  return result;
}
function validateWave(level){
  const w=newWorld(level),p=makePlayer(w.chunks[0].mode),errors=[],segments=[];
  let held=false,longestHold=0,longestSpam=0,tightest=Infinity;
  for(const c of w.chunks){
    const previous=w.chunks[Math.max(0,w.chunks.indexOf(c)-1)];
    w.simulationStart=previous.entityStart;
    const start={...p},clock=w.clock,initialHeld=held,edges=[];
    let run=0,spam=0;
    for(let i=0;i<c.tape.length;i++){
      const down=!!(c.tape[i]&1),before=p.x;
      if(c.mode===2&&before>c.base+460&&before<c.base+1370&&down!==held){
        edges.push(i);
        const duration=run*CONFIG.step;
        longestHold=Math.max(longestHold,duration);
        spam=duration<.19?spam+duration:0;
        longestSpam=Math.max(longestSpam,spam);run=0;
      }
      physics(p,w,CONFIG.step,down,!!(c.tape[i]&2),false);held=down;run++;
      if(p.dead){errors.push('Witness failed: '+c.pattern.id);break;}
    }
    if(c.mode!==2)continue;
    tightest=Math.min(tightest,c.channel.half*2);
    let failed=0,tested=0;
    for(const edge of edges)for(const shift of [-3,3]){
      const probe={...start};w.clock=clock;let prior=initialHeld;
      for(let i=0;i<c.tape.length&&!probe.dead;i++){
        let bits=c.tape[i];
        if(shift<0&&i>=edge+shift&&i<edge)bits=c.tape[edge];
        if(shift>0&&i>=edge&&i<edge+shift)bits=c.tape[edge-1];
        const down=!!(bits&1);
        physics(probe,w,CONFIG.step,down,down&&!prior,false);prior=down;
      }
      tested++;if(probe.dead)failed++;
    }
    w.clock=clock+c.tape.length*CONFIG.step;
    if(failed)errors.push(c.pattern.id+': '+failed+'/'+tested+' timing perturbations failed');
    const preview=(CONFIG.width-CONFIG.playerX-40)/velocityX({...start,mode:2,speed:c.speed});
    if(preview<CONFIG.waveMinPreview)errors.push('Insufficient preview: '+c.pattern.id);
    segments.push({name:c.pattern.name,tier:c.tier,tests:tested,failed,preview:+preview.toFixed(2)});
  }
  const result={ok:!errors.length,errors,tightestGap:tightest,longestHold,longestSpam,segments};
  if(settings.debugLevels||CONFIG.debugLevels){console.table(segments);console.info('[PHASE Wave validator]',result);}
  return result;
}
function validateAllLevels(){
  if(validationStatus.startsWith('Checking'))return;
  let index=0,failures=0;
  function next(){
    if(index===LEVELS.length){
      validationStatus=failures?'FAILED: '+failures+' levels. See console.':
        'PASS: all '+LEVELS.length+' levels / arcs / orbs / variety.';
      return;
    }
    const level=LEVELS[index++];
    validationStatus='Checking '+index+'/'+LEVELS.length+': '+level.name;
    try{
      const report=validateLevel(level);
      console.table([report.metrics]);
      if(!report.ok){failures++;console.error('[PHASE validation]',level.name,report.errors);}
    }catch(error){failures++;console.error('[PHASE validation]',level.name,error);}
    setTimeout(next,25);
  }
  validationStatus='Checking 0/'+LEVELS.length;setTimeout(next,25);
}

const audio={
  ctx:null,master:null,music:null,sfx:null,noise:null,next:0,tick:0,start:0,level:null,
  unlock(){
    if(!this.ctx){
      try{
        const AC=window.AudioContext||window.webkitAudioContext;
        if(!AC)throw new Error('Web Audio is unavailable');
        this.ctx=new AC();this.master=this.ctx.createGain();this.master.connect(this.ctx.destination);
        this.music=this.ctx.createGain();this.music.connect(this.master);
        this.sfx=this.ctx.createGain();this.sfx.connect(this.master);
        this.noise=this.ctx.createBuffer(1,this.ctx.sampleRate*.15,this.ctx.sampleRate);
        const data=this.noise.getChannelData(0),random=rng(77);for(let i=0;i<data.length;i++)data[i]=random()*2-1;
        this.apply();
      }catch(e){this.error='AUDIO UNAVAILABLE - PLAYING SILENTLY';console.warn('PHASE audio:',e);return;}
    }
    if(this.ctx.state==='suspended')this.ctx.resume().catch(e=>{this.error='AUDIO BLOCKED - CLICK TO RETRY';console.warn('PHASE audio resume:',e);});
  },
  apply(){if(this.ctx){this.master.gain.setTargetAtTime(settings.mute?0:settings.master,this.ctx.currentTime,.025);this.music.gain.value=settings.music;this.sfx.gain.value=settings.sfx;}},
  begin(level,clock=0){
    this.level=level;this.tick=Math.floor(clock/(60/level.bpm/4));
    if(this.ctx){this.start=this.ctx.currentTime-clock;this.next=this.ctx.currentTime+.04;}
  },
  tone(freq,t,duration,volume,type,bus,slide=0){
    const a=this.ctx,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+duration);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.008);
    g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(bus);o.start(t);o.stop(t+duration+.01);
    o.onended=()=>{o.disconnect();g.disconnect();};
  },
  sound(kind){
    if(!this.ctx||this.ctx.state!=='running')return;
    const t=this.ctx.currentTime;
    if(kind==='jump')this.tone(300,t,.09,.08,'sine',this.sfx,620);
    if(kind==='portal')this.tone(420,t,.18,.1,'sine',this.sfx,1000);

  pump(){

    }
  },
  beat(){
    if(run&&(screen==='play'||screen==='pause'||screen==='complete'))
      return (run.world.clock*run.level.bpm/60)%1;

  }
};

// ==================== PHYSICS ====================
function overlap(x,y,h,e){return x+h>e.x&&x-h<e.x+e.w&&y+h>e.y&&y-h<e.y+e.h;}
function playerHalf(p){return CONFIG.size*CONFIG.tuning[p.mode].hitbox*(p.size||1)/2;}
function velocityX(p){
  return CONFIG.scrollSpeed*p.speed*CONFIG.tuning[p.mode].speed*(p.dash>0?CONFIG.dashMultiplier:1);
}
function stepShipVelocity(p,down,dt){
  // Input changes acceleration, not velocity: releasing a climb traces an arc.
  const entry=p.shipEntry/CONFIG.shipEntryDuration;
  const gravityScale=down?1:1-entry*(1-CONFIG.shipEntryGravityScale);
  const acceleration=(CONFIG.shipGravity*gravityScale-(down?CONFIG.shipThrust:0))*p.gravity;
  p.shipEntry=Math.max(0,p.shipEntry-dt);
  p.vy=clamp(p.vy+acceleration*dt,-CONFIG.shipMaxVelocity,CONFIG.shipMaxVelocity);
}
function orbRadius(){return CONFIG.size*CONFIG.orbTrigger/2;}
function nearbyOrb(p,w){
  if(p.mode===2)return null;
  const radius=orbRadius();
  let nearest=null,distance=Infinity;
  for(let i=w.simulationStart||0;i<w.entities.length;i++){
    const e=w.entities[i];if(e.type!=='orb')continue;
    const dx=p.x-e.x,dy=p.y-e.y,squared=dx*dx+dy*dy;
    if(Math.abs(dx)<=radius&&Math.abs(dy)<=radius&&squared<distance){
      nearest=e;distance=squared;
    }
  }
  return nearest;
}
function spikeHit(p,e,margin=0){
  const h=playerHalf(p)+margin,sw=e.w*CONFIG.spikeWidth,sh=e.h*CONFIG.spikeHeight;
  const left=e.x+(e.w-sw)/2,top=e.flip?e.y+e.h-sh:e.y;
  return p.x+h>left&&p.x-h<left+sw&&p.y+h>top&&p.y-h<top+sh;
}
function channelCenter(c,x,clock=0){
  const n=c.nodes,local=x-c.base;
  const offset=Math.sin(clock/c.period*Math.PI*2)*(c.motion||0);
  for(let i=0;i<n.length-2;i+=2)if(local<=n[i+2])
    return lerp(n[i+1],n[i+3],clamp((local-n[i])/(n[i+2]-n[i]),0,1))+offset;
  return n[n.length-1]+offset;
}
function channelHalf(c,x,clock){
  const t=clamp((x-c.x)/(c.end-c.x),0,1);
  let extra=0;
  if(c.shape===5||c.shape===28)extra=(1-t)*35;
  else if(c.shape===7)extra=(1-Math.abs(t*2-1))*36;
  else if(c.shape===8||c.shape===29)extra=Math.abs(t*2-1)*38;
  return c.half+extra-(c.pulse||0)*(1+Math.sin(clock/c.period*6.283))/2;
}
function supportY(w,p,gravity){
  const h=playerHalf(p);let target=gravity>0?CONFIG.floor-h:CONFIG.ceiling+h;
  for(let i=w.simulationStart||0;i<w.entities.length;i++){
    const e=w.entities[i];if(e.type!=='block'||p.x+h<=e.x||p.x-h>=e.x+e.w)continue;
    if(gravity>0&&e.y>=p.y+h)target=Math.min(target,e.y-h);
    if(gravity<0&&e.y+e.h<=p.y-h)target=Math.max(target,e.y+e.h+h);
  }
  return target;
}
function switchMode(p,mode){
  p.mode=mode;p.vy=0;p.angle=0;p.hold=0;p.buffer=0;p.orbBuffer=0;
  p.dual=false;p.dualOffset=0;
  p.shipEntry=mode===1?CONFIG.shipEntryDuration:0;
  p.grounded=![1,2,4].includes(mode);p.support=null;
  p.y=p.grounded?(p.gravity>0?CONFIG.floor-playerHalf(p):CONFIG.ceiling+playerHalf(p)):355;
  p.py=p.y;p.teleport=.16;
}
function fireOrb(p,e,w,effects){
  if(p.mode===2)return false;
  const kind=e.kind,g=p.gravity,mini=p.size<1?CONFIG.miniJump:1;
  const adapt=p.mode===1?.43:p.mode===4?.55:1;
  const strength=CONFIG.orbStrength[kind]*mini*adapt;
  if(kind==='blue'||kind==='green'){
    p.gravity=-g;p.vy=p.gravity*strength;
  }else if(kind==='black')p.vy=g*strength;
  else if(kind==='dash'){p.dash=CONFIG.dashDuration;p.vy=0;}
  else p.vy=-g*strength;
  if(p.mode===1)p.shipEntry=0;
  p.grounded=false;p.support=null;p.hold=CONFIG.robotHold;
  p.buffer=0;p.orbBuffer=0;p.orbSerial=p.serial;p.lastOrb=e.oid;p.orbCount++;
  if(effects){
    audio.sound('orb-'+kind);burst(e.x,e.y,18,ORB_COLORS[kind],'rings');
  }

}
const waveEcho={x:0,y:0,mode:2,size:1,gravity:-1};
function checkHazards(p,w,h,secondary=false){
  for(let i=w.simulationStart||0;i<w.entities.length;i++){
    const e=w.entities[i];
    if(e.x+(e.w||0)+40<p.x-h||e.x-40>p.x+h)continue;
    if(secondary&&e.type==='block'&&overlap(p.x,p.y,h,e))return true;
    if(e.type==='spike'&&spikeHit(p,e))return true;
    if(e.type==='laser'&&e.active&&overlap(p.x,p.y,h,e))return true;
    if(e.type==='saw'){
      const dx=Math.max(0,Math.abs(p.x-e.x)-h),dy=Math.max(0,Math.abs(p.y-e.y)-h);
      if(dx*dx+dy*dy<e.r*e.r)return true;
    }
  }
  for(let i=0;i<w.channels.length;i++){
    const c=w.channels[i];
    // Ship channels are authoring guides; only the visible pillar gates collide.
    if(c.mode===1)continue;
    if(c.mode!==p.mode||p.x+h<c.x||p.x-h>c.end)continue;
    if(secondary&&!c.dual)continue;
    let a=channelCenter(c,clamp(p.x-h,c.x,c.end),w.clock);
    let b=channelCenter(c,clamp(p.x+h,c.x,c.end),w.clock);
    if(secondary){
      a=CONFIG.floor+CONFIG.ceiling+c.dualOffset-a;
      b=CONFIG.floor+CONFIG.ceiling+c.dualOffset-b;
    }
    const half=Math.min(channelHalf(c,p.x-h,w.clock),channelHalf(c,p.x+h,w.clock));
    if(p.y-h<Math.max(a,b)-half||p.y+h>Math.min(a,b)+half)return true;
  }
  if(!secondary&&p.mode===2&&p.dual){
    waveEcho.x=p.x;waveEcho.y=CONFIG.floor+CONFIG.ceiling+p.dualOffset-p.y;
    waveEcho.size=p.size;waveEcho.gravity=-p.gravity;
    if(waveEcho.y-h<CONFIG.ceiling||waveEcho.y+h>CONFIG.floor)return true;
    return checkHazards(waveEcho,w,h,true);
  }
  return false;
}
function physics(p,w,dt,down,press,effects=true){
  if(p.dead)return;
  w.clock=(w.clock||0)+dt;
  const first=w.simulationStart||0;
  for(let i=first;i<w.entities.length;i++)updateEntity(w.entities[i],w.clock);
  p.px=p.x;p.py=p.y;p.pa=p.angle;
  p.teleport=Math.max(0,p.teleport-dt);p.padLock=Math.max(0,p.padLock-dt);
  p.cooldown=Math.max(0,p.cooldown-dt);p.dash=Math.max(0,p.dash-dt);
  p.buffer=press?CONFIG.inputBuffer:Math.max(0,p.buffer-dt);
  p.orbBuffer=press?CONFIG.orbInputBuffer:Math.max(0,p.orbBuffer-dt);
  if(press)p.serial++;
  if(p.support&&p.grounded){p.x+=p.support.x-p.support.px;p.y+=p.support.y-p.support.py;}
  let h=playerHalf(p),fired=false;
  if(p.orbBuffer>0&&p.orbSerial!==p.serial){
    const e=nearbyOrb(p,w);
    if(e)fired=fireOrb(p,e,w,effects);
  }
  const mode=p.mode,wasGrounded=p.grounded,mini=p.size<1?CONFIG.miniJump:1;
  const action=!fired&&(p.buffer>0||(down&&(mode===0||mode===5)&&p.grounded));
  if(action){
    if((mode===0||mode===5)&&p.grounded){
      p.vy=-(mode===5?CONFIG.robotJump:CONFIG.jumpVelocity)*p.gravity*mini;p.grounded=false;p.hold=0;p.buffer=0;
      if(effects)audio.sound('jump');
    }else if(mode===3&&p.grounded){
      p.gravity*=-1;p.vy=0;p.grounded=false;p.buffer=0;if(effects)audio.sound('jump');
    }else if(mode===4){
      p.vy=-CONFIG.ufoHop*p.gravity*mini;p.buffer=0;if(effects)audio.sound('jump');
    }else if(mode===6&&p.grounded&&p.cooldown===0){
      p.gravity*=-1;p.snapFrom=p.y;p.y=supportY(w,p,p.gravity);p.py=p.y;p.teleport=.12;p.vy=0;p.buffer=0;p.cooldown=CONFIG.spiderCooldown;
      if(effects)audio.sound('portal');
    }
  }
  const vx=velocityX(p);
  if(p.dash>0)p.vy=0;
  else if(mode===2){p.vy=(down?-1:1)*vx*(p.size<1?CONFIG.waveMiniSlope:CONFIG.waveSpeed)*p.gravity;p.grounded=false;}
  else if(mode===1){stepShipVelocity(p,down,dt);p.grounded=false;}
  else{
    const gravity=mode===4?CONFIG.ufoGravity:CONFIG.gravity;
    p.vy+=gravity*p.gravity*dt;
    if(mode===5&&!p.grounded){
      if(down&&p.hold<CONFIG.robotHold&&p.vy*p.gravity<0)p.vy-=CONFIG.robotBoost*p.gravity*dt*mini;
      p.hold+=dt;
    }
  }
  // Substeps also cover mini hitboxes, dash boosts and high-speed slams.
  const steps=Math.max(1,Math.ceil(Math.max(vx,Math.abs(p.vy))*dt/Math.max(3,h*.45)));
  const sub=dt/steps;
  for(let step=0;step<steps;step++){
    p.x+=vx*sub;
    for(let i=first;i<w.entities.length;i++){
      const e=w.entities[i];
      if(e.type==='block'&&overlap(p.x,p.y,h-.02,e)){p.dead=true;return;}
    }
    const oldY=p.y;p.y+=p.vy*sub;p.grounded=false;p.support=null;
    for(let i=first;i<w.entities.length;i++){
      const e=w.entities[i];if(e.type!=='block')continue;
      const horizontal=p.x+h>e.x&&p.x-h<e.x+e.w;
      const face=p.gravity>0?e.y:e.y+e.h;
      const touching=horizontal&&Math.abs(p.y+p.gravity*h-face)<.04&&p.vy*p.gravity>=0;
      if(!overlap(p.x,p.y,h,e)&&!touching)continue;
      if(mode!==1&&mode!==2&&p.gravity>0&&p.vy>=0&&oldY+h<=e.y+.1){
        p.y=e.y-h;p.vy=0;p.grounded=true;p.support=e;
      }else if(mode!==1&&mode!==2&&p.gravity<0&&p.vy<=0&&oldY-h>=e.y+e.h-.1){
        p.y=e.y+e.h+h;p.vy=0;p.grounded=true;p.support=e;
      }else{p.dead=true;return;}
    }
    if(p.y+h>=CONFIG.floor-.001){
      if(mode===2){p.y=CONFIG.floor-h;}
      else if(mode===1||(p.gravity<0&&p.y+h>CONFIG.floor+.001)){p.dead=true;return;}
      if(mode!==2&&p.gravity>0){p.y=CONFIG.floor-h;p.vy=0;p.grounded=true;}
    }
    if(p.y-h<=CONFIG.ceiling+.001){
      if(mode===2){p.y=CONFIG.ceiling+h;}
      else if(mode===1||(p.gravity>0&&p.y-h<CONFIG.ceiling-.001)){p.dead=true;return;}
      if(mode!==2&&p.gravity<0){p.y=CONFIG.ceiling+h;p.vy=0;p.grounded=true;}
    }
    if(checkHazards(p,w,h)){p.dead=true;return;}
  }
  if(!wasGrounded&&p.grounded&&effects)burst(p.x,p.y+p.gravity*h,8,skins[p.mode].primary,'dust');
  for(let i=first;i<w.entities.length;i++){
    const e=w.entities[i];if(e.x>p.x+h+32||e.x+e.w<p.x-h-32)continue;
    if((e.type==='mode'||e.type==='gravity'||e.type==='speed'||e.type==='size'||e.type==='dual')&&p.x>=e.x&&p.px<e.x){
      if(e.type==='mode')switchMode(p,e.mode);
      if(e.type==='gravity'&&p.gravity!==e.value){
        p.gravity=e.value;p.vy=0;p.grounded=false;p.support=null;p.buffer=0;p.orbBuffer=0;
      }
      if(e.type==='speed')p.speed=e.speed;
      if(e.type==='dual'){p.dual=!!e.value;p.dualOffset=e.offset||0;}
      if(e.type==='size'){
        const old=playerHalf(p);p.size=e.value;h=playerHalf(p);
        if(p.grounded)p.y+=(old-h)*p.gravity;
        else p.y=clamp(p.y,CONFIG.ceiling+h+.02,CONFIG.floor-h-.02);
        p.py=p.y;
      }
      if(effects){audio.sound('portal');burst(p.x,p.y,14,skins[p.mode].glow,'sparks');}
    }
    if(e.type==='pad'&&p.gravity===e.gravity&&p.padLock===0&&overlap(p.x,p.y,h+3,e)&&mode!==2){
      p.vy=-CONFIG.jumpVelocity*1.12*p.gravity*mini;p.grounded=false;p.padLock=.2;if(effects)audio.sound('jump');
    }
  }
  if(p.mode===0){if(!p.grounded)p.angle+=vx*dt*.009*p.gravity;else p.angle=Math.round(p.angle/(Math.PI/2))*Math.PI/2;}
  else if(p.mode===3)p.angle+=vx*dt*.045*p.gravity;
  else if(p.mode===2)p.angle=Math.atan2(p.vy,vx);
  else if(p.mode===1)p.angle=Math.atan2(p.vy,vx)*.65;
  else p.angle=lerp(p.angle,0,Math.min(1,dt*20));
}

// ==================== GAME MODES / RUN STATE ====================
const trailX=new Float64Array(CONFIG.trailLength),trailY=new Float64Array(CONFIG.trailLength);
let trailHead=0,trailCount=0,validationStatus='',levelError='';
function startLevel(level,endless=false){
  let w;
  try{w=newWorld(level,endless);}
  catch(error){
    levelError='LEVEL VALIDATION FAILED: '+error.message;
    console.error('[PHASE level generation]',error);return;
  }
  if(w.level.flowParty)level=w.level;
  levelError='';audio.unlock();audio.begin(level);attempt=1;releaseInput();
  const mode=w.chunks[0].mode;
  const recordKey=endless?'v2-endless-'+seedText+'-'+endlessMode:level.id;
  run={level,world:w,p:makePlayer(mode),camera:-CONFIG.playerX,pcamera:-CONFIG.playerX,best:endless?Number(progress[recordKey])||0:best(level.id),recordKey};
  for(let i=0;i<particles.length;i++)particles[i].active=false;
  run.p.py=run.p.y;trailCount=0;celebration=0;go('play');
}
function record(){
  if(!run)return;
  const value=run.world.endless?Math.floor(run.p.x/10):Math.min(100,run.p.x/run.world.length*100);
  const old=Number(progress[run.recordKey])||0;
  if(value>old){progress[run.recordKey]=value;save('progress',progress);}
  run.best=Math.max(run.best,value);
}
function die(){
  const p=run.p,s=skins[p.mode];record();audio.sound('die');
  burst(p.x,p.y,65,s.primary,s.death);burst(p.x,p.y,20,s.glow,'sparks');
  for(let i=0;i<particles.length;i++)if(particles[i].active)particles[i].x-=p.x;
  shock.x=0;shock.y=p.y;shock.life=.5;shake=settings.shake*16;deathFlash=settings.reduceFlash?0:.1;
  const level=run.level,w=run.world;
  run.world=newWorld(level,w.endless,w.seed,w.chosen);run.p=makePlayer(run.world.chunks[0].mode);run.p.py=run.p.y;
  run.camera=-CONFIG.playerX;run.pcamera=run.camera;trailCount=0;attempt++;
  // A held input carries across an instant restart; discrete presses do not.
  input.pressed=false;accumulator=0;audio.begin(level);
}
function pause(){if(screen==='play'){releaseInput();record();go('pause');}}
function resume(){releaseInput();audio.unlock();audio.begin(run.level,run.world.clock);go('play');}
function go(next){previousScreen=screen;screen=next;screenAge=0;colorPopup=null;rebinding=false;seedEditing=false;sliderDrag=null;hitCount=0;}
function tick(dt){
  time+=dt;screenAge+=dt;shake=Math.max(0,shake-dt*42);deathFlash=Math.max(0,deathFlash-dt);
  updateParticles(dt);
  if(screen!=='play'){input.pressed=false;input.released=false;return;}
  const p=run.p,w=run.world;
  if(w.endless)extendWorld(w,p.x);
  run.pcamera=run.camera;
  physics(p,w,dt,input.down,input.pressed);
  input.pressed=false;input.released=false;
  if(p.dead){die();return;}
  // Exponential tracking of the lead target settles to a constant screen X.
  const target=p.x-CONFIG.playerX+velocityX(p)/12;
  run.camera=lerp(run.camera,target,1-Math.exp(-12*dt));
  trailX[trailHead]=p.x;trailY[trailHead]=p.y;trailHead=(trailHead+1)%CONFIG.trailLength;trailCount=Math.min(trailCount+1,CONFIG.trailLength);
  const s=skins[p.mode];
  if(settings.trail&&s.trail!=='none'&&s.trail!=='line'&&Math.random()<.35){
    const color=s.trail==='rainbow'?'hsl('+Math.floor(time*180%360)+',100%,70%)':s.trail==='flame'?'#ffbd69':s.glow;
    emit(p.x-14,p.y, -40-Math.random()*90,(Math.random()-.5)*60,.2+Math.random()*.2,3,color,'spark');
  }
  if(!w.endless&&p.x>=w.length){
    record();progress[run.level.id]=100;save('progress',progress);audio.sound('win');celebration=2.5;
    burst(p.x,p.y,150,run.level.color,'shards');go('complete');
  }
}

// ==================== PARTICLES (fixed object pool) ====================
const particles=Array.from({length:CONFIG.particles},()=>({active:false,x:0,y:0,vx:0,vy:0,life:0,max:1,size:1,color:'#fff',kind:'spark',rotation:0}));
let particleCursor=0;
const shock={x:0,y:0,life:0};
function emit(x,y,vx,vy,life,size,color,kind){
  const budget=settings.particles==='Off'?0:settings.particles==='Low'?.25:settings.particles==='Medium'?.55:1;
  if(budget===0||Math.random()>budget)return;
  const p=particles[particleCursor];particleCursor=(particleCursor+1)%particles.length;
  p.active=true;p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.life=life;p.max=life;p.size=size;p.color=color;p.kind=kind;p.rotation=Math.random()*6.28;
}
function burst(x,y,n,color,style){
  for(let i=0;i<n;i++){const a=Math.random()*6.28,v=style==='dust'?30+Math.random()*90:70+Math.random()*340;emit(x,y,Math.cos(a)*v,Math.sin(a)*v,.25+Math.random()*.65,style==='shards'?3+Math.random()*6:2+Math.random()*3,color,style);}
}
function updateParticles(dt){
  for(let i=0;i<particles.length;i++){
    const p=particles[i];if(!p.active)continue;p.life-=dt;if(p.life<=0){p.active=false;continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.kind==='dust'?160:360)*dt;p.rotation+=dt*3;
  }
  shock.life=Math.max(0,shock.life-dt);
}

// ==================== RENDERING ====================
function resize(){
  pixelRatio=Math.min(window.devicePixelRatio||1,2);
  viewportScale=Math.min(innerWidth/1280,innerHeight/720);
  const w=Math.round(1280*viewportScale),h=Math.round(720*viewportScale);
  canvas.width=Math.round(w*pixelRatio);canvas.height=Math.round(h*pixelRatio);
  canvas.style.width=w+'px';canvas.style.height=h+'px';
  offsetX=0;offsetY=0;
}
window.addEventListener('resize',resize);resize();
function text(value,x,y,size=18,color='#e7edff',align='left',weight=500){
  ctx.fillStyle=color;ctx.font=weight+' '+(size*settings.uiScale)+'px system-ui,Segoe UI,sans-serif';ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(value,x,y);
}
function line(x1,y1,x2,y2,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function roundRect(x,y,w,h,r=10){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function panel(x,y,w,h,color='#111b30',border='#27364e'){
  ctx.fillStyle=color;roundRect(x,y,w,h,14);ctx.fill();ctx.strokeStyle=border;ctx.lineWidth=1;ctx.stroke();
}
function background(camera,color,accent){
  const b=settings.brightness,pulse=settings.pulse&&!settings.reduceFlash?Math.max(0,1-audio.beat()*3):0;
  ctx.fillStyle='#090d1c';ctx.fillRect(0,0,1280,720);
  if(settings.background!=='minimal'){
    const gradient=ctx.createLinearGradient(0,0,1280,720);
    gradient.addColorStop(0,color);gradient.addColorStop(.55,'#11172d');gradient.addColorStop(1,accent);
    ctx.globalAlpha=b*(.13+pulse*.025);ctx.fillStyle=gradient;ctx.fillRect(0,0,1280,720);ctx.globalAlpha=1;
  }
  if(settings.background==='parallax'){
    ctx.save();ctx.globalAlpha=b*.14;ctx.strokeStyle=color;ctx.lineWidth=1;
    const phase=(camera*.16)%80;
    for(let x=-80;x<1380;x+=80){line(x-phase,100,x-phase,720,color);line(0,x+60,1280,x+60,color);}
    ctx.globalAlpha=b*.13;
    for(let i=0;i<13;i++){
      const x=((i*173-camera*.07)%1500+1500)%1500-100,y=170+(i*113)%330;
      ctx.save();ctx.translate(x,y);ctx.rotate(time*.04+i);polygon(3+i%4,25+i%3*17);ctx.stroke();ctx.restore();
    }
    ctx.restore();
  }
  // Horizon, underfloor reflection grid, and distant light columns.
  ctx.save();ctx.globalAlpha=.12*b;
  for(let i=0;i<18;i++){const x=((i*91-camera*.3)%1400+1400)%1400;ctx.fillStyle=i%2?color:accent;ctx.fillRect(x,CONFIG.floor-25-(i*47)%180,2,240);}
  ctx.restore();
}
function drawWorld(alpha){
  const p=run.p,w=run.world,l=run.level,cam=lerp(run.pcamera,run.camera,alpha);
  const chunk=w.chunks.find(c=>p.x>=c.base&&p.x<c.base+CONFIG.chunkWidth);
  const section=chunk?chunk.section:0;
  const palette=chunk&&chunk.palette?chunk.palette:l;
  background(cam,section===2||section===4?palette.accent:palette.color,palette.accent);
  ctx.save();
  if(shake>0&&!settings.reduceFlash)
    ctx.translate(Math.sin(time*93)*shake,Math.cos(time*117)*shake*.55);
  ctx.translate(-cam,0);
  ctx.fillStyle='#101b2c';ctx.fillRect(cam,CONFIG.floor,1280,110);
  ctx.fillRect(cam,0,1280,CONFIG.ceiling);
  ctx.shadowBlur=settings.glow?12:0;ctx.shadowColor=l.color;
  line(cam,CONFIG.floor,cam+1280,CONFIG.floor,l.color,2);
  line(cam,CONFIG.ceiling,cam+1280,CONFIG.ceiling,l.accent,2);
  ctx.shadowBlur=0;
  for(let i=0;i<w.channels.length;i++){
    const c=w.channels[i];if(c.mode===1||c.end<cam||c.x>cam+1280)continue;
    ctx.fillStyle='#17233d';ctx.strokeStyle=settings.contrast?'#fff':
      (c.mode===2?WAVE_STYLES[c.style||0].color:l.color);
    ctx.lineWidth=settings.contrast?3:2;
    if(c.dual){
      for(let icon=0;icon<2;icon++)for(let side=-1;side<=1;side+=2){
        ctx.beginPath();
        for(let j=0;j<c.nodes.length;j+=2){
          const x=c.base+c.nodes[j],center=channelCenter(c,x,w.clock);
          const y=(icon?CONFIG.floor+CONFIG.ceiling+c.dualOffset-center:center)+side*channelHalf(c,x,w.clock);
          if(j===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
        }
        ctx.stroke();
      }
      continue;
    }
    for(let side=-1;side<=1;side+=2){
      ctx.beginPath();ctx.moveTo(c.x,side<0?CONFIG.ceiling:CONFIG.floor);
      for(let j=0;j<c.nodes.length;j+=2){
        const x=c.base+c.nodes[j];
        ctx.lineTo(x,channelCenter(c,x,w.clock)+side*channelHalf(c,x,w.clock));
      }
      ctx.lineTo(c.end,side<0?CONFIG.ceiling:CONFIG.floor);
      ctx.closePath();ctx.fill();ctx.stroke();
    }
    if(c.variant===17){
      // Dashed "fake" gates are decoration, never invisible collision.
      ctx.save();ctx.setLineDash([4,8]);ctx.globalAlpha=.28;
      line(c.x,330,c.end,330,l.accent,1);line(c.x,380,c.end,380,l.accent,1);
      ctx.restore();
    }
  }
  for(let i=0;i<w.entities.length;i++){
    const e=w.entities[i];if(e.x+e.w<cam-60||e.x>cam+1340)continue;
    drawEntity(e,l,w.clock,p);
  }
  ctx.shadowBlur=0;
  if(!w.endless){
    ctx.setLineDash([12,10]);line(w.length,100,w.length,610,l.color,4);ctx.setLineDash([]);
    text('FINISH',w.length,80,14,l.color,'center',800);
  }
  drawTrail();
  const x=lerp(p.px,p.x,alpha),y=lerp(p.py,p.y,alpha),angle=lerp(p.pa,p.angle,alpha);
  if(p.teleport>0&&p.mode===6){
    ctx.globalAlpha=p.teleport/.12;line(x,p.snapFrom,x,y,skins[p.mode].glow,4);ctx.globalAlpha=1;
  }
  drawIcon(p.mode,x,y,32*p.size,angle,1,p.gravity);
  if(p.mode===2&&p.dual){
    const echoY=CONFIG.floor+CONFIG.ceiling+p.dualOffset-y;
    drawIcon(2,x,echoY,32*p.size,-angle,1,-p.gravity);
    ctx.save();ctx.translate(0,CONFIG.floor+CONFIG.ceiling+p.dualOffset);ctx.scale(1,-1);
    drawTrail();ctx.restore();
    if(settings.hitboxes){
      const half=playerHalf(p);ctx.strokeStyle='#ff466e';
      ctx.strokeRect(x-half,echoY-half,half*2,half*2);
    }
  }
  if(settings.hitboxes){
    const h=playerHalf(p);ctx.strokeStyle='#ff466e';ctx.lineWidth=1;
    ctx.strokeRect(x-h,y-h,h*2,h*2);
  }
  const surface=p.gravity>0?CONFIG.floor:CONFIG.ceiling;
  ctx.save();ctx.translate(x,surface*2-y+p.gravity*4);ctx.scale(1,-1);
  drawIcon(p.mode,0,0,32*p.size,angle,.12*clamp(1-Math.abs(surface-y)/130,0,1),p.gravity);
  ctx.restore();drawParticles();
  if(shock.life>0){
    ctx.globalAlpha=shock.life*1.6;ctx.strokeStyle=skins[p.mode].glow;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(shock.x,shock.y,(.5-shock.life)*380,0,7);ctx.stroke();ctx.globalAlpha=1;
  }
  ctx.restore();
  if(!settings.reduceFlash&&section===3){
    const fog=ctx.createLinearGradient(0,0,1280,0);
    fog.addColorStop(0,'#a8b7dd12');fog.addColorStop(.6,'#a8b7dd00');fog.addColorStop(1,'#a8b7dd18');
    ctx.fillStyle=fog;ctx.fillRect(0,100,1280,510);
  }
  if(deathFlash>0){
    ctx.globalAlpha=deathFlash;ctx.fillStyle=l.accent;ctx.fillRect(0,0,1280,720);ctx.globalAlpha=1;
  }
  drawHUD();
  if(chunk)text(STRUCTURE[section]+' / '+(chunk.palette?chunk.palette.name+' T'+chunk.tier+' / ':'')+chunk.pattern.name.toUpperCase(),
    640,85,11,l.color,'center',700);
}
function drawEntity(e,l,clock,p){
  const outline=settings.contrast?'#ffffff':l.color;
  const pulse=settings.reduceFlash?0:Math.sin(clock*5);
  ctx.shadowColor=l.color;ctx.shadowBlur=settings.glow?8:0;
  ctx.lineWidth=settings.contrast?3:1.6;
  if(e.type==='block'){
    ctx.fillStyle='#192940';ctx.fillRect(e.x,e.y,e.w,e.h);
    ctx.strokeStyle=outline;ctx.strokeRect(e.x,e.y,e.w,e.h);
    ctx.shadowBlur=0;ctx.fillStyle='#36516b';
    if(e.h>12&&e.w>12)ctx.fillRect(e.x+5,e.y+5,e.w-10,3);
    if(e.ax||e.ay)text('< >',e.x+e.w/2,e.y+e.h/2,10,l.accent,'center',700);
  }else if(e.type==='spike'){
    ctx.fillStyle='#26344f';ctx.strokeStyle=settings.contrast?'#fff':l.accent;
    ctx.beginPath();ctx.moveTo(e.x,e.flip?e.y:e.y+e.h);
    ctx.lineTo(e.x+e.w/2,e.flip?e.y+e.h:e.y);
    ctx.lineTo(e.x+e.w,e.flip?e.y:e.y+e.h);ctx.closePath();ctx.fill();ctx.stroke();
  }else if(e.type==='pad'){
    ctx.fillStyle='#ffbd69';roundRect(e.x,e.y,e.w,e.h,4);ctx.fill();
    text(e.gravity>0?'^':'v',e.x+e.w/2,e.y-e.gravity*13,14,'#ffbd69','center',800);
  }else if(e.type==='orb'){
    const color=ORB_COLORS[e.kind],r=11+pulse*1.5;
    ctx.shadowColor=color;ctx.strokeStyle=settings.contrast?'#fff':color;

function hsv(h,s,v){
  const f=n=>{const k=(n+h*6)%6;return Math.round((v-v*s*Math.max(0,Math.min(k,4-k,1)))*255);};
  return '#'+[f(5),f(3),f(1)].map(n=>n.toString(16).padStart(2,'0')).join('');
}
function hexHSV(hex){
  const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;
  let h=0;
  if(d)h=max===r?((g-b)/d+6)%6:max===g?(b-r)/d+2:(r-g)/d+4;
  return {h:h/6,s:max?d/max:0,v:max};
}

  drawIcon(skinMode,274,381+Math.sin(time*2.7)*14,105,skinMode===3?time:Math.sin(time)*.15);
  text('SHAPE '+(s.shape+1)+' / 8',274,543,13,'#8ca2bf','center',700);
  const x=540;
  cycle('Icon shape',s.shape,Array.from({length:8},(_,i)=>i),v=>{s.shape=v;skinChanged();},x,214,630);
  // Render the index more readably over the generic cycle label.
  ctx.fillStyle='#121d31';ctx.fillRect(x+450,220,150,22);text('SHAPE '+(s.shape+1)+'  >',x+538,231,13,'#c5d0e7','center',700);
  colorControl('Primary',s,'primary',x,267,skinChanged);
  colorControl('Secondary',s,'secondary',x,313,skinChanged);
  colorControl('Glow',s,'glow',x,359,skinChanged);
  cycle('Face / pattern',s.overlay,['eyes','visor','cross','stripes','none'],v=>{s.overlay=v;skinChanged();},x,414,630);
  cycle('Trail',s.trail,['none','line','sparkle','flame','rainbow'],v=>{s.trail=v;skinChanged();},x,468,630);
  cycle('Death burst',s.death,['shards','sparks','rings'],v=>{s.death=v;skinChanged();},x,522,630);
  button('RANDOMISE',64,636,200,46,()=>{
    s.shape=Math.floor(Math.random()*8);s.primary=COLORS[Math.floor(Math.random()*8)];s.secondary=COLORS[Math.floor(Math.random()*8)];s.glow=COLORS[Math.floor(Math.random()*8)];s.overlay=['eyes','visor','cross','stripes','none'][Math.floor(Math.random()*5)];s.trail=['none','line','sparkle','flame','rainbow'][Math.floor(Math.random()*5)];s.death=['shards','sparks','rings'][Math.floor(Math.random()*3)];skinChanged();
  });
  button('RESET MODE',282,636,200,46,()=>{skins[skinMode]=defaultSkin(skinMode);skinChanged();});
  button('APPLY TO ALL MODES',887,636,328,46,()=>{for(let i=0;i<7;i++)skins[i]={...skins[skinMode]};skinChanged();},true);
  if(colorPopup)drawColorPopup();
}
function overlayMenu(complete){
  ctx.fillStyle='#060b18d9';ctx.fillRect(0,0,1280,720);
  panel(390,136,500,451,'#101c30','#365167');
  text(complete?'SIGNAL COMPLETE':'SIGNAL PAUSED',640,194,12,run.level.color,'center',800);
  text(complete?'CIRCUIT CLEARED':'TAKE A BREATH',640,248,31,'#edf7ff','center',900);
  text(run.level.name+' / ATTEMPT '+attempt,640,296,13,'#a3b5ce','center',600);
  if(complete){
    text('100.0%',640,345,40,run.level.color,'center',900);
    button('RUN AGAIN',430,395,420,48,()=>startLevel(run.level,run.world.endless),true,run.level.color);
    button('LEVEL SELECT',430,462,420,44,()=>{selectedTab=run.level.kind==='challenge'?3:0;scroll=0;go('levels');});
    if(celebration>0){celebration-=CONFIG.step;ctx.save();ctx.translate(640,350);for(let i=0;i<25;i++){ctx.fillStyle=COLORS[i%8];const a=i*2.4,r=160+Math.sin(time+i)*75;ctx.fillRect(Math.cos(a)*r,Math.sin(a)*r+Math.sin(time*3+i)*20,4,8);}ctx.restore();}
  }else{
    button('RESUME',430,337,420,48,resume,true);
    button('SETTINGS',430,401,200,44,()=>go('settings'));
    button('SKIN LAB',650,401,200,44,()=>go('skins'));
    button('RESTART',430,461,200,44,()=>startLevel(run.level,run.world.endless));
    button('QUIT',650,461,200,44,()=>{record();go('home');});
  }
  text(complete?'THE NEXT FREQUENCY IS WAITING.':'P / ESC TO RESUME',640,554,11,'#748ca9','center',700);
}
function render(alpha){
  ctx.setTransform(canvas.width/1280,0,0,canvas.height/720,0,0);
  ctx.globalAlpha=1;ctx.shadowBlur=0;hitCount=0;
  if(screen==='play'||screen==='pause'||screen==='complete'){
    drawWorld(screen==='play'?alpha:1);if(screen!=='play')overlayMenu(screen==='complete');
  }else{
    background(time*35,'#64fbd4','#8c69ef');
    ctx.save();
    const fade=clamp(screenAge/.22,0,1);
    ctx.globalAlpha=fade;ctx.translate(0,(1-fade)*12);
    if(screen==='home')home();
    if(screen==='levels')levelsMenu();
    if(screen==='settings')settingsMenu();
    if(screen==='skins')skinsMenu();
    ctx.restore();
  }
  if(settings.fps)text(Math.round(fps)+' FPS / 120 HZ SIM',1259,707,10,'#91b8bd','right',700);
  if(storageWarning)text('STORAGE ISSUE / IN-MEMORY FALLBACK ACTIVE',640,710,10,'#ffbd69','center',700);
  if(audio.error)text(audio.error,640,695,10,'#ffbd69','center',700);
  if(levelError)text(levelError,640,620,12,'#ffbd69','center',700);
  let cursor=screen==='play'?'crosshair':'default';
  if(screen!=='play')for(let i=0;i<hitCount;i++)if(hovered(hits[i].x,hits[i].y,hits[i].w,hits[i].h)){cursor='pointer';break;}
  canvas.style.cursor=cursor;
}
function frame(stamp){
  const elapsed=lastTime?Math.min(.1,(stamp-lastTime)/1000):0;lastTime=stamp;
  if(elapsed>0)fps=lerp(fps,1/elapsed,.04);
  accumulator+=elapsed;
  while(accumulator>=CONFIG.step){tick(CONFIG.step);accumulator=Math.max(0,accumulator-CONFIG.step);}
  audio.pump();render(accumulator/CONFIG.step);requestAnimationFrame(frame);
}
// Read-only game metadata and deterministic physics hooks for local validation.
window.PHASE={CONFIG,MODES,LEVELS,PATTERNS,WAVE_TEST,newWorld,makePlayer,physics,channelCenter,extendWorld,
  stepShipVelocity,orbRadius,nearbyOrb,
  validateLevel,validateWave,waveGap,levelMetrics,parseTile,fireOrb,playerHalf,velocityX,checkHazards,
  startLevel,settings,skins,get run(){return run;},get screen(){return screen;}};
requestAnimationFrame(frame);
})();
</script>
